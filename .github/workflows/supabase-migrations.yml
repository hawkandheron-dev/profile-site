name: Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dry-run migrations
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$SUPABASE_DATABASE_URL" ]; then
            echo "SUPABASE_DATABASE_URL is not set."
            exit 1
          fi
          # Use direct connection (port 5432) instead of pooled connection
          # (port 6543) to avoid PgBouncer "prepared statement already exists"
          # errors. The Supabase CLI uses prepared statements internally.
          DB_URL="${SUPABASE_DATABASE_URL//:6543/:5432}"
          echo "=== Pending migrations ==="
          supabase db push --db-url "$DB_URL" --dry-run

      - name: Push migrations
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          DB_URL="${SUPABASE_DATABASE_URL//:6543/:5432}"
          supabase db push --db-url "$DB_URL" --yes
