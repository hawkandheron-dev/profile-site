<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.72  0 0 0 0 0.58  0 0 0 0 0.38  0 0 0 0.55 0"/>
    </filter>
    <filter id="fibers">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.6" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.25  0 0 0 0.35 0"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="#e9d8b0"/>
  <rect width="256" height="256" filter="url(#fibers)"/>
  <rect width="256" height="256" filter="url(#grain)" opacity="0.6"/>
</svg>
