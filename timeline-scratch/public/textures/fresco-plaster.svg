<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="plaster">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.93  0 0 0 0 0.85  0 0 0 0 0.72  0 0 0 0.5 0"/>
    </filter>
    <filter id="cracks">
      <feTurbulence type="turbulence" baseFrequency="0.9" numOctaves="2" seed="5"/>
      <feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.3  0 0 0 0 0.22  0 0 0 0.25 0"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="#f0e2c8"/>
  <rect width="256" height="256" filter="url(#plaster)"/>
  <rect width="256" height="256" filter="url(#cracks)" opacity="0.35"/>
</svg>
